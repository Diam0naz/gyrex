name: collect

on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the top of the hour
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ingest/target
          key: ingest-test-${{ runner.os }}-${{ hashFiles('ingest/Cargo.lock', 'ingest/src/**') }}
          restore-keys: ingest-test-${{ runner.os }}-
      - run: cargo test --locked --manifest-path ingest/Cargo.toml
      - run: cargo build --release --locked --manifest-path ingest/Cargo.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q

  collect:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ingest/target
          key: ingest-release-${{ runner.os }}-${{ hashFiles('ingest/Cargo.lock', 'ingest/src/**') }}
          restore-keys: ingest-release-${{ runner.os }}-
      - run: cargo build --release --locked --manifest-path ingest/Cargo.toml
      - run: pip install -e .
      - name: Collect prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}  # Neon, pooled
        run: gyrex-collect --dump out
      - name: Keep raw payloads for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: out/*_raw.json
          retention-days: 7
          if-no-files-found: ignore
